<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SOPilot</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="phone">
    <header class="top">
      <div class="brand">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M14.7 6.3a4 4 0 0 0-5.6 5.6L3 18l3 3 6.1-6.1a4 4 0 0 0 5.6-5.6l-2.5 2.5-2.4-2.4 2.5-2.5z"/>
          </svg>
        </span>
        <div>
          <h1>SOPilot</h1>
          <p>Kaveri Precision, Hosur</p>
        </div>
      </div>
      <button id="clear-btn" type="button" title="Clear conversation" aria-label="Clear conversation">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>
    </header>

    <main id="thread" class="thread"></main>

    <footer class="bottom-bar">
      <section id="chips" class="chips hidden">
        <p>Quick questions</p>
        <div id="chip-row"></div>
      </section>

      <form id="ask-form" class="composer" autocomplete="off">
        <input
          id="question"
          name="question"
          type="text"
          enterkeyhint="send"
          placeholder="Ask about a fault code, limit or procedure"
          required
        />
        <button type="submit" id="ask-btn">
          <span>Ask</span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
    </footer>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
